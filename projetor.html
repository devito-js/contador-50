<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111214">
  <title>Tela do projetor | Tempo de Prova</title>
  <link rel="stylesheet" href="style.css">
  <script src="projetor.js" defer></script>
</head>
<body class="projection">
  <header class="projection-header">
    <div class="projection-brand">
      <span>ARTE 3D PARA</span>
      <strong>JOGOS <span>DIGITAIS</span></strong>
    </div>
    <button type="button" class="button button-secondary" id="fullscreen">Tela cheia</button>
  </header>
  <main class="projection-main">
    <div class="projection-heading">
      <h1 id="module">Aguardando módulo</h1>
      <strong id="status" role="status">Aguardando painel de controle</strong>
    </div>
    <p class="projection-caption">TEMPO RESTANTE</p>
    <div id="remaining" class="projection-time" role="timer">00:00</div>
    <progress id="elapsed" max="1" value="0" aria-label="Tempo decorrido"></progress>
    <p id="total" class="projection-total">Tempo total —</p>
  </main>
</body>
</html>
